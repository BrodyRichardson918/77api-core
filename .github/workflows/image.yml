name: Image (77api-core)

on:
  push:
    tags:
      - 'v*-77api.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Only a tag may publish: a manual dispatch on a branch would otherwise push :<branch> and move :latest.
    if: startsWith(github.ref, 'refs/tags/')
    name: Build and push linux/amd64 image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write tag into VERSION
        run: echo "${GITHUB_REF_NAME}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/brodyrichardson918/77api-core:${{ github.ref_name }}
            ghcr.io/brodyrichardson918/77api-core:latest
          labels: |
            org.opencontainers.image.source=https://github.com/BrodyRichardson918/77api-core
